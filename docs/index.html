<body>
<div id="root"></div>

<script>
// Apply persisted theme synchronously, before any render, to avoid flash
(function () {
  try {
    var t = localStorage.getItem('drafteo.theme');
    if (!t || (t !== 'light' && t !== 'dark')) {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  } catch (_) {}
})();
</script>
